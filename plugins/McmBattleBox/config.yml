# Battle Box v2 settings
# Centre block type: concrete (pickaxe, default - like the current event) or wool (shears).
centre-block: concrete
# Pick a new random arena theme every round (map rotation). false = one random theme for the whole game.
rotate-maps-each-round: true
# Force one theme for every round: greenhouse, toyworkshop, skilodge (empty = off). Also /bb theme <id|off>.
force-theme: ""
# Inner floor half-size: 14 gives the 29x29 floor. Allowed 11..18 (props are laid out for 14).
arena-half-size: 14
first-kit-seconds: 20
kit-seconds: 15
fight-seconds: 0
end-seconds: 5
max-rounds: 9
