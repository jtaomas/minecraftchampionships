# Sky Blockle (classic 18-minute version) - McmSkyBlockle
# Values marked PENDING_RESEARCH are provisional (see SPEC.md / README.md). The owner decides; change them here,
# then /sbl reload (takes effect next game).

# ---------------------------------------------------------------- timing (confirmed: 1 round, 18 minutes)
game-seconds: 1080
# Frozen countdown on the start islands before the game clock starts.
countdown-seconds: 10
# PENDING_RESEARCH grace-seconds: PvP off for this long after GO (0 = no grace).
grace-seconds: 60
# Victory pause before the core takes everyone back to the lobby.
end-delay-seconds: 8

# ---------------------------------------------------------------- scoring (confirmed 70/10/150 scaled to 14/2/30)
points:
  kill: 14
  # to every OTHER living player each time a player dies
  survive-death: 2
  # to every player still alive when the game ends (last side standing or time-out)
  alive-at-end: 30
  # team kills give nothing (confirmed); friendly fire is off (confirmed)
  team-kill: 0

# The last enemy attacker within this many seconds gets the kill for ANY death (void, fall, border, lava...).
kill-credit-seconds: 10

# PENDING_RESEARCH timeout-tiebreak: ranking of sides still alive at 18:00. Criteria in order, any of:
# players-alive, kills, health. Sides equal on every criterion share the result (draw).
timeout-tiebreak: [players-alive, kills]

# ---------------------------------------------------------------- deaths (PENDING_RESEARCH: item handling)
death:
  # drop the inventory at the death point (non-void deaths)
  drop-items: true
  # void deaths drop nothing (items would fall into the void anyway)
  void-drop-items: false
  # drop vanilla experience orbs on death
  drop-xp: true
  # Falling this far below the lowest map block = void death (instant).
  void-depth: 12

# ---------------------------------------------------------------- start (PENDING_RESEARCH)
# Items each player gets at GO. Same item format as loot.yml, e.g.  - {item: cooked_beef, amount: 4}
start-inventory: []
start-xp-levels: 0

# ---------------------------------------------------------------- border (PENDING_RESEARCH border schedule)
# Vanilla world border (square, visible) centred on the castle, plus our own damage outside it.
# points: [seconds after GO, half-size in blocks]. Radius may be a number or a map token:
#   map, castle, arena, enchanting, brewing, fort, pillar, start, generator, rock  (optionally +N / -N)
# The border moves linearly between consecutive points.
border:
  enabled: true
  points:
    - [0, map+8]
    - [360, map+8]
    - [900, castle]
    - [1080, arena]
  # damage per second outside the border: [seconds after GO, damage], linear in between
  damage:
    - [0, 1.0]
    - [1080, 4.0]
  # action-bar warning when this close to the border
  warn-distance: 10

# ---------------------------------------------------------------- map
map:
  # auto = use com.mcm.games.skyblockle.map.SkyMap if it is in the jar, else the stub; or force: skymap | stub
  generator: auto
  # 0 = new random seed every game
  seed: 0
  # world y of the map's local y = 0
  base-y: 100
  # build only as many wedges as there are sides (confirmed), clamped to this range
  # SkyMap needs at least 2 wedges (a 1-side test game gets 2 wedges, one unused)
  min-wedges: 2
  max-wedges: 10
  # blocks players may build above the highest map block
  build-height-above-map: 24
  # spectators are kept within map radius + this, and within the map's height range +/- this
  spectator-margin: 24
  # re-apply fluids with physics after placing so cobblestone generators start working
  fluid-physics: true
  # ms per tick spent clearing the old map
  clear-ms-per-tick: 20
  blocks-per-tick: 40000

# ---------------------------------------------------------------- loot
loot:
  # PENDING_RESEARCH: items go into random slots (true) or the first slots (false)
  random-slots: true
  # PENDING_RESEARCH chest refills: seconds after GO at which every map chest gets a fresh roll in its
  # empty slots. Empty list = chests never refill.
  refill-at: []

# ---------------------------------------------------------------- world rules
world:
  difficulty: normal
  # vanilla natural regeneration
  natural-regeneration: true
  fall-damage: true
  # block nether portal creation and ender chests (they are shared with other worlds)
  block-portals: true
  block-ender-chests: true
