# Sky Blockle loot tables by island type.
#
# Tiers ascend towards the centre: start/generator (0) -> mid islands (1) -> fort (2) -> brewing/enchanting (3)
# -> castle (4). Each tier keeps its power level, but every chest rolls its own selection from the tier's
# categories, so chests of the same tier differ (owner feedback after the first playtest).
#
# Comments mark each item: R = seen in a real classic chest (video research skyblockle_video.md §1, confidence in
# brackets), A = added default for same-tier variety (NOT researched), remix = from the remix data
# (skyblockle_rules.md §3, not verified for classic).
#
# Table format:
#   tier: 0-4             power tier (the offline loot check enforces it)
#   slots:                fixed layout, slot -> item. Slot = number (0-26) or "r<row>c<col>" (row 1-3, col 1-9)
#   fixed: [...]          items always added (random empty slots)
#   categories:           <name>: {picks: 2 | "1-2", items: [...]}  - that many DISTINCT picks per chest
#   (old format "rolls: 4-6" + "items: [...]" still works as one category)
# Item format (also used by start-inventory in config.yml):
#   {item: <material>, amount: 3 | "1-4", weight: 10, enchants: {sharpness: 1}, potion: healing, name: "&aText"}
#   - for enchanted_book, "enchants" become stored enchantments
#   - potion / splash_potion / lingering_potion / tipped_arrow take "potion: <potion type>"
#
# How a game is dealt (LootDeal.java): chests are grouped into areas (one team wedge, one shared between-team
# slot, the castle). In an area, picks are "least dealt first": the entry handed out the fewest times so far wins,
# ties by weight, so e.g. the 4 castle chests share out all 4 diamond armour pieces before any repeats. A chest never
# gets two pieces for the same armour slot, nor the same item twice from a category while others are left.
# Fairness: wedge 0 is rolled once and copied exactly (items, amounts, slots) to every other wedge; shared slot 0 is
# copied to every shared slot. Only the castle is random per game. Everything is re-rolled every game.
#
# Table choice: <type>_<variant> if present (variant from the map, or inferred for MID chests from the block
# under the chest: pillar / spike / grass), else <type>.

