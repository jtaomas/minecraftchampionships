# Rocket Spleef: the ORIGINAL MCC game (MCC 1-13), not Rush.
# Confidence: H = stated in a source or plainly visible, M = one source or a measurement with some error, L = guess.
# Sources: game-plugins/research/mcc_archive/rocket_spleef_old/notes.md (section 7 = MCC 13 VOD measurements,
# frames in research/mcc_archive/rocket_spleef_old/frames/vod_mcc13/).

rounds: 3                     # H  W-RS: 3 rounds, one per map (Nanotube, Rings, Easter Eggs!)
countdown-seconds: 15         # H  VOD: 15 s in the drop room before the floor opens (sidebar 00:15 -> 00:00)
drop-in-title-seconds: 10     # H  VOD: "Dropping in 10 ... 1" titles for the last 10 s
drop-room-height: 12          # L  drop room floor this many blocks above the map's top
round-seconds: 240            # H  W-RS + VOD: 4:00 per round (drop -> "Round Over!")
tnt-time-at-seconds: 120      # H  W-RS + VOD: "TNT Time starts in 2:00" at the drop
intermission-seconds: 10      # H  VOD: "Round Over!" then sidebar "Next Round: 00:09 ... 00:01"
map-anchor-y: 80              # world y of the lowest map block (void world mcc_rocketspleef)
elimination-depth: 10         # L  eliminated this many blocks below the lowest map block

launcher:                     # H  "rocket launchers (the shovel) with a clip size of 3" (MCC 13 tutorial text)
  clip: 3                     # H
  start-ammo: 0               # H  VOD: "Reloading (0/3)" right after the drop
  reload-ticks: 42            # M  VOD action bar: 2.0-2.2 s per rocket ((1/3) 119.4->121.5 s, (2/3) 121.6->123.7 s)
  reload-resets-on-fire: true # H  VOD: "(2/3)" bar at 7/11 -> "(1/3)" empty after a shot
  shot-gap-ticks: 8           # L  0.4 s between shots
  rocket-speed: 2.0           # L  blocks per tick, straight line (MCC 8 made rockets faster)
  rocket-life-ticks: 60       # L  3 s, about 120 blocks of range
  blast-radius: 2.5           # L  blocks removed in this sphere
  knockback-radius: 4.0       # L
  knockback-horizontal: 1.1   # L  blocks/tick at the blast centre (MCC 8 lowered knockback)
  rocket-jump-height: 9.0     # L  peak height in blocks of a point-blank rocket jump ("propel yourself upwards": H)
  melee-knockback: 0.9        # L value / H that it exists: "The melee attack on your rocket launcher has high knockback"

firework:                     # H  "You also have an elytra and 1 firework. You can use fireworks ONLY during elytra flight"
  count: 1
  flight-duration: 1

tnt:                          # H  "Fireworks will be removed from inventories and TNT will start raining down from the sky"
  warning-seconds: 10         # H  VOD chat: "[Rocket Spleef] 10 seconds until TNT time starts"
  night-sky: true             # H  VOD: the sky turns to night at "TNT Time!"
  per-second: 4.0             # L- VOD: roughly 10-15 TNT in view at once while they fall; rate not counted exactly
  drop-height-min: 15         # L
  drop-height-max: 25         # L
  fuse-ticks: 80              # M  VOD: first TNT explosions about 4 s after "TNT Time!" (2:00 -> 1:56)
  blast-radius: 3.0           # L
  knockback-radius: 4.5       # L

punching: true                # owner: punches knock back (no damage) and count as the last hit
kill-credit-ms: 10000         # L  how long a hit counts as "last hit" for elimination credit

# MCC coins (base x1.0; the core applies the event multiplier). Old Rocket Spleef (MCC 1-13), the final values from
# MCC 12-13 (H: W-RS History; MCC 13 tutorial "+3 every time another player dies and you're still alive, +10 if you were
# the last person to hit a player before their death, +100 for lasting until the end of the round";
# research/mcc_archive/rocket_spleef_old/notes.md section 3). See game-plugins/COINS.md.
coins:
  outlive: 3                 # MCC 8+: every time another player dies and you are still alive
  elimination: 10            # MCC 12+: you were the last to hit them before they died
  sole-team-survival: 100    # MCC 3+: to each player alive at the end of the round, only if all survivors are one team
