# McmParkourTag settings.
# MCC coins (base x1.0; the core applies the event multiplier). Source: MCC wiki, Parkour Tag "Coin Rewards"
# (https://mcchampionship.fandom.com/wiki/Parkour_Tag; research/mcc_archive/parkour_tag/pt-1/notes.md). COINS.md.
# "Shared" pools pay each player pool / (players who played the match): a runner pool / runners, a team pool / team members
# (3 runners and 4 members in a full team, as in MCC; benched players are not counted).
coins:
  survive-10s: 2           # MCC: every 10 seconds a hunted runner survives
  survive-round: 0         # MCC: nothing extra for being alive at 0:00 (OURS if > 0)
  runners-survive-pool: 60 # MCC: shared amongst the runners if any runner survives until the end of the round
  tag: 6                   # MCC: per tag, decreasing by 1 every 10 seconds (min 1)
  tag-all: 42              # MCC: hunter tags all runners, decreasing by 7 every 10 seconds
  tag-all-step: 7
  first-clear-pool: 120    # MCC: shared amongst the team if their hunter tags all enemy runners first

# Uneven teams: the bigger side benches (bigger - smaller) random players each match (fair rotation); they spectate their
# own arena, are never the hunter and earn no coins. false = play uneven.
bench-uneven-teams: true
