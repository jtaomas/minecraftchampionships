# Sky Blockle loot tables by island type.
#
# Classic Sky Blockle chests are FIXED, hand-arranged layouts (video research skyblockle_video.md §1: the start
# and generator chests are identical slot for slot in MCC 1 and MCC 4). Observed chests use "slots" layouts.
# Tables marked "DEFAULT, NOT RESEARCHED" were never opened on camera and keep provisional weighted tiers.
#
# Table format:
#   slots:                fixed layout, slot -> item. Slot = number (0-26) or "r<row>c<col>" (row 1-3, col 1-9)
#   rolls: 4-6            number of weighted picks per chest (a number or "min-max"; 0/absent = none)
#   fixed: [...]          items always added (random empty slots)
#   items: [...]          weighted pool; each pick adds one stack
# Item format (also used by start-inventory in config.yml):
#   {item: <material>, amount: 3 | "1-4", weight: 10, enchants: {sharpness: 1}, potion: healing, name: "&aText"}
#   - for enchanted_book, "enchants" become stored enchantments
#   - potion / splash_potion / lingering_potion / tipped_arrow take "potion: <potion type>"
# Table choice: <type>_<variant> if present (variant from the map, or inferred for MID chests from the block
# under the chest: pillar / spike / grass), else <type>.
# Chests are filled once when the map is built (see loot.refill-at in config.yml).

# Start island chest - observed (video #1/#2, H). Unconfirmed IDs: terracotta (orange-brown block),
# wheat_seeds (green seeds), oak_sapling (oak/birch-type sapling).
start:
  slots:
    r1c4: {item: sugar_cane, amount: 9}
    r1c6: {item: terracotta, amount: 6}
    r2c2: {item: oak_sapling, amount: 1}
    r2c4: {item: wheat_seeds, amount: 3}
    r2c5: {item: apple, amount: 6}
    r2c6: {item: snowball, amount: 8}
    r2c8: {item: acacia_sapling, amount: 1}
    r3c4: {item: milk_bucket}
    r3c5: {item: milk_bucket}
    r3c6: {item: milk_bucket}

