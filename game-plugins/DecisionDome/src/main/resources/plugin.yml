name: McmDecisionDome
version: 2.0.0
main: com.mcm.games.decisiondome.DecisionDomePlugin
api-version: '1.21'
depend: [MinecraftMondayCore]
description: Faithful egg-and-chicken Decision Dome vote provider for MinecraftMondayCore
commands:
  dome:
    description: Decision Dome admin commands
    usage: /dome <test [hub|dome]|end|skipwait|cancel|status|tp|simulate <n>>
    permission: mcm.dome.admin
permissions:
  mcm.dome.admin:
    default: op
