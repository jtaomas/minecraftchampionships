name: McmFindTheButton
version: 1.0.0
main: com.mcm.games.findthebutton.FindTheButtonPlugin
api-version: '1.21'
depend: [MinecraftMondayCore]
description: Find the Button minigame for the MinecraftMondayCore tournament.
commands:
  ftbmap:
    description: Find the Button admin helpers (list, build, tp, spots, dump).
    usage: /ftbmap <list|build|tp|spots|dump> [map]
    permission: findthebutton.admin
permissions:
  findthebutton.admin:
    default: op
