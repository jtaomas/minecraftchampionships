# McmBingo settings. Everything except coins: is a default, not a researched value; adjust after playtesting.
# Changes apply at the next game start (world.* settings at the next server start).

# Lockout Bingo as a separate game on the games screen. Owner decision: off.
lockout-enabled: false

card:
  # Items per tier on a card: [easy, medium, hard, very hard] (must add up to 25)
  bingo-mix: [9, 10, 5, 1]
  lockout-mix: [6, 10, 6, 3]
  # At most this many squares that can be made from wood alone
  max-wood-only-items: 2
  teleport-cooldown-seconds: 45

# MCC coins (base x1.0; the core applies the event multiplier). Source: MCC wiki, Bingo but Fast "Coin Rewards"
# (https://mcchampionship.fandom.com/wiki/Bingo_but_Fast, current scoring). See game-plugins/COINS.md.
# Every value is a TEAM pool shared amongst the team: each member gets the MCC per-member share (pool / 4).
coins:
  # Bingo: coins per square by tier [easy, medium, hard, very hard]. MCC pays the same for every square: 50.
  bingo-tier: [50, 50, 50, 50]
  # % of that for the 1st team to get the square, 2nd, 3rd, ... (MCC 50 / 40 / 30 / 20 / 10, 6th-10th team 5)
  bingo-placement-percent: [100, 80, 60, 40, 20, 10]
  bingo-line-first-4: 200    # MCC: each of a team's first four lines (rows, columns, diagonals)
  bingo-line-later: 100      # MCC: each of the remaining eight lines
  bingo-full-card: 0         # OURS: MCC has no full-card bonus (0 = off)
  # Lockout Bingo (OURS: lockout is not in current MCC; old MCC lockout paid per item, see COINS.md)
  lockout-tier: [100, 100, 100, 100]
  lockout-line: 200
  lockout-placement: [0, 0, 0]
  # Coins for killing a player of another side (OURS; MCC pays nothing, 0 = off)
  pvp-kill: 0

top:
  cooldown-seconds: 30
  # Block /top for a few seconds after taking PvP damage
  blocked-in-combat: true
  combat-seconds: 8

cave-finder:
  cooldown-seconds: 20
  # Chunks around the player that are scanned (2 = 5x5 chunks, about 80 blocks across)
  radius-chunks: 2

kit:
  cooked-beef: 64

world:
  # Natural mob spawning (animals and hostile mobs). The server's spawn-animals/spawn-monsters=false would
  # otherwise switch them off in this world too, so the plugin sets this world's spawn flags itself.
  mob-spawning: true
  # Let time run during a game (day-night cycle). Off = time stays at start-time.
  daylight-cycle: true
  # Time of day at the start of each game (0 = sunrise, 1000 = morning, 13000 = night)
  start-time: 0
  # Place a village, temples, a ruined portal, a shipwreck and buried treasure in each game area
  place-structures: true
  # Extra worm caves: chance per chunk that a tunnel system starts there, and the share that opens to the surface
  extra-cave-chance-per-chunk: 0.06
  extra-cave-entrance-share: 0.3

debug-timing: false
