name: McmBattleBox
version: 2.0.0
main: com.mcm.games.battlebox.BattleBoxPlugin
api-version: '1.21'
depend: [MinecraftMondayCore]
description: Battle Box minigame for the MinecraftMondayCore tournament.
commands:
  bb:
    description: Battle Box admin helpers (arena preview, kit menu, theme forcing).
    usage: /bb <arena|kits|theme|dump|themes>
    permission: battlebox.admin
permissions:
  battlebox.admin:
    default: op
