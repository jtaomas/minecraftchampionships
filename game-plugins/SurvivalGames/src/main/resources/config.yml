# Modern MCC-style Hunger Games / Survival Games (hungergames)
# Small numeric defaults not fixed by research can be tuned here.

prefer-imported-maps: true

timings:
  countdown-seconds: 10
  grace-seconds: 15
  game-seconds: 300
  refill-at-elapsed-seconds: 135
  airdrop-interval-seconds: 65
  deathmatch-at-remaining-seconds: 60

border:
  initial-radius: 124
  final-radius: 16
  deathmatch-radius: 22

# MCC coins (base x1.0; the core applies the event multiplier). Source: MCC wiki, Survival Games "Coin Rewards"
# (https://mcchampionship.fandom.com/wiki/Survival_Games; research/mcc_archive/survival_games). See game-plugins/COINS.md.
# Team pools are shared amongst the team: each member gets the MCC per-member share (pool / 4).
coins:
  kill: 65                 # MCC: personal elimination
  outlive: 3               # MCC: every time another player is eliminated and you are still alive
  airdrop: 180             # MCC: team pool for breaking open an airdrop crate
  # MCC team placement by how long the team survived: 1st 650 ... 10th 330 (later teams get the last value)
  placement: [650, 600, 560, 520, 480, 450, 420, 390, 360, 330]
