name: MinecraftMondayCore
version: 3.1.0
main: com.mcm.MinecraftMondayPlugin
api-version: '1.21'
description: All-in-one Minecraft Monday / Championship tournament server plugin with real community maps, Speed Survival, multi-round events, authentic team split scoring, and admin skip controls.
commands:
  mcm:
    description: Open the Minecraft Monday Tournament Controller or run admin commands.
    usage: /mcm [start|play <game>|skip|stop|reset|teamsize <1-5>]
    aliases: [mcc, tournament]
  team:
    description: Open the Team Selector GUI.
    usage: /team
    aliases: [teams]
